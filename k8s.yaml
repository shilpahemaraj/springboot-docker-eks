apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-docker-eks-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: springboot-docker-eks-app
  template:
    metadata:
      labels:
        app: springboot-docker-eks-app
    spec:
      containers:
        - name: springboot-docker-eks-app
          image: 68997743943.dkr.ecr.us-east-1.amazonaws.com/springboot-docker-eks:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: springboot-docker-eks-app-service
spec:
  selector:
    app: springboot-docker-eks-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
